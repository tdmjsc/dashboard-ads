plugins { id 'com.android.application' }
// Thông báo đẩy cần app/google-services.json (Firebase console). Không có file thì app vẫn build, chỉ không có push.
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.tdmjsc.ads'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tdmjsc.ads'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
}
